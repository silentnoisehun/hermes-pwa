<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090B">
  <meta name="description" content="HERMES — Serverless Telegram bot + local-first WASM agent">
  <title>HERMES — Serverless Agent</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23f2f3f5' width='180' height='180'/><text x='90' y='130' font-size='120' font-weight='bold' text-anchor='middle' fill='%2308090b'>H</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #08090B;
      color: #F2F3F5;
      line-height: 1.5;
    }

    #app {
      display: flex;
      height: 100vh;
      flex-direction: column;
    }

    header {
      background: #0D0F12;
      border-bottom: 1px solid #24292F;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.875rem;
      color: #9BA3AE;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #93C69C;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-dot.offline {
      background: #D88955;
      animation: none;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      gap: 0.5rem;
      max-width: 90%;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-content {
      background: #121519;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border-left: 3px solid #76D4D1;
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: #181C21;
      border-left-color: #D88955;
    }

    .message.system .message-content {
      background: transparent;
      border-left-color: #9BA3AE;
      font-size: 0.875rem;
      color: #9BA3AE;
    }

    .message-time {
      font-size: 0.75rem;
      color: #9BA3AE;
      align-self: flex-end;
      margin-top: 0.25rem;
    }

    footer {
      border-top: 1px solid #24292F;
      padding: 1rem;
      background: #0D0F12;
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: #121519;
      border: 1px solid #24292F;
      color: #F2F3F5;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #76D4D1;
      box-shadow: 0 0 0 2px rgba(118, 212, 209, 0.1);
    }

    button {
      background: #181C21;
      border: 1px solid #24292F;
      color: #F2F3F5;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover {
      background: #24292F;
      border-color: #76D4D1;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      color: #9BA3AE;
      padding: 2rem;
    }

    .empty-state h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: #F2F3F5;
    }

    .config-info {
      background: #121519;
      border: 1px solid #24292F;
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem;
      font-size: 0.875rem;
    }

    .config-info code {
      background: #0D0F12;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }

    @media (max-width: 768px) {
      .message {
        max-width: 100%;
      }

      h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>🧠 HERMES</h1>
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Preparing...</span>
      </div>
    </header>

    <div id="chat">
      <div class="config-info">
        <strong>⚙️ Setup Required</strong>
        <p style="margin-top: 0.5rem;">Bot URL not configured. Edit <code>botUrl</code> in the source.</p>
      </div>
      <div class="empty-state">
        <h2>Start a conversation</h2>
        <p>Your agent is ready to remember and learn.</p>
      </div>
    </div>

    <footer>
      <input 
        type="text" 
        id="messageInput" 
        placeholder="Type a message or /recall query..."
        autocomplete="off"
      />
      <button id="sendBtn">Send</button>
    </footer>
  </div>

  <script type="module">
    interface Message {
      id: string;
      role: 'user' | 'assistant' | 'system';
      content: string;
      timestamp: string;
    }

    class HermesApp {
      private chatEl: HTMLElement;
      private inputEl: HTMLInputElement;
      private sendBtn: HTMLButtonElement;
      private statusDot: HTMLElement;
      private statusText: HTMLElement;
      private messages: Message[] = [];
      private botUrl: string = ''; // SET YOUR BOT URL HERE

      constructor() {
        this.chatEl = document.getElementById('chat')!;
        this.inputEl = document.getElementById('messageInput')!;
        this.sendBtn = document.getElementById('sendBtn')!;
        this.statusDot = document.getElementById('statusDot')!;
        this.statusText = document.getElementById('statusText')!;

        // Check if botUrl is configured
        if (!this.botUrl) {
          this.addSystemMessage('⚠️ Bot URL not configured. Please set botUrl in the HTML file.');
          this.setOffline();
          return;
        }

        this.setupListeners();
        this.loadMessages();
        this.checkStatus();
      }

      private setupListeners() {
        this.sendBtn.addEventListener('click', () => this.sendMessage());
        this.inputEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            this.sendMessage();
          }
        });
      }

      private async sendMessage() {
        const text = this.inputEl.value.trim();
        if (!text) return;

        this.sendBtn.disabled = true;

        // Add user message
        const userMsg: Message = {
          id: `msg-${Date.now()}`,
          role: 'user',
          content: text,
          timestamp: new Date().toISOString(),
        };

        this.messages.push(userMsg);
        this.renderMessage(userMsg);
        this.saveMessages();
        this.inputEl.value = '';

        // Sync to bot
        try {
          const response = await fetch(`${this.botUrl}/webhook`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: {
                text,
                from: { id: this.getUserId() },
                chat: { id: this.getUserId() },
                date: Math.floor(Date.now() / 1000),
              },
            }),
          });

          if (!response.ok) throw new Error('Bot error');

          const data = await response.json();

          // Add system response
          const sysMsg: Message = {
            id: `msg-${Date.now()}`,
            role: 'system',
            content: data.response || '✅ Message received',
            timestamp: new Date().toISOString(),
          };

          this.messages.push(sysMsg);
          this.renderMessage(sysMsg);
          this.saveMessages();
        } catch (error) {
          console.error('Send failed:', error);
          this.addSystemMessage(`❌ Error: ${error.message}`);
          this.setOffline();
        } finally {
          this.sendBtn.disabled = false;
        }
      }

      private renderMessage(msg: Message) {
        if (this.chatEl.querySelector('.empty-state')) {
          this.chatEl.innerHTML = '';
        }

        if (this.chatEl.querySelector('.config-info')) {
          this.chatEl.querySelector('.config-info')!.remove();
        }

        const div = document.createElement('div');
        div.className = `message ${msg.role}`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.textContent = msg.content;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date(msg.timestamp).toLocaleTimeString('hu-HU');

        div.appendChild(contentDiv);
        div.appendChild(timeDiv);

        this.chatEl.appendChild(div);
        this.chatEl.scrollTop = this.chatEl.scrollHeight;
      }

      private addSystemMessage(text: string) {
        const msg: Message = {
          id: `sys-${Date.now()}`,
          role: 'system',
          content: text,
          timestamp: new Date().toISOString(),
        };
        this.renderMessage(msg);
      }

      private async checkStatus() {
        if (!this.botUrl) return;

        try {
          const response = await fetch(`${this.botUrl}/health`);
          if (response.ok) {
            this.setOnline();
          } else {
            this.setOffline();
          }
        } catch {
          this.setOffline();
        }

        setTimeout(() => this.checkStatus(), 10000);
      }

      private setOnline() {
        this.statusDot.classList.remove('offline');
        this.statusText.textContent = 'Online';
      }

      private setOffline() {
        this.statusDot.classList.add('offline');
        this.statusText.textContent = 'Offline';
      }

      private getUserId(): number {
        let userId = localStorage.getItem('hermes-user-id');
        if (!userId) {
          userId = String(Math.floor(Math.random() * 1000000000));
          localStorage.setItem('hermes-user-id', userId);
        }
        return parseInt(userId);
      }

      private saveMessages() {
        localStorage.setItem('hermes-messages', JSON.stringify(this.messages));
      }

      private loadMessages() {
        const stored = localStorage.getItem('hermes-messages');
        if (stored) {
          try {
            this.messages = JSON.parse(stored);
            this.messages.forEach(msg => this.renderMessage(msg));
          } catch (e) {
            console.error('Failed to load messages', e);
          }
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new HermesApp();
    });
  </script>
</body>
</html>
